name: 教务处简报

# 跑在 GitHub 的服务器上，不依赖自己的电脑是否开机。
# GitHub 的 schedule 是「尽力而为」：会延迟几分钟到几小时，偶尔直接跳过。
# 所以每个时段排 4-5 次触发，脚本按「时段」去重：哪个先跑成功就由哪个发，一个时段只推一次。
# cron 用 UTC：北京时间 = UTC + 8。
on:
  schedule:
    # 实测这个仓库的定时任务会被 GitHub 系统性推迟 4-5.5 小时（不是偶然）。
    # 所以触发点按“提前量”铺开，配合脚本里的时段判断（早报最早 09:30、晚报最早 17:00，
    # 早了就归前一天晚报并跳过），无论推迟 0 小时还是 8 小时，都有一条会落在窗口里。
    # 下面注释里是各触发点对应的北京时间。
    # ---- 早报：04:00 / 05:00 / 06:00 / 07:00 / 08:30 / 09:45 ----
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
    - cron: "30 0 * * *"
    - cron: "45 1 * * *"
    # ---- 晚报：12:30 / 13:30 / 14:30 / 15:30 / 17:00 ----
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: 强制推一条（推送最近 1 天的条目）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jwc-brief
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查教务处并推送
        if: ${{ !inputs.test_push }}
        env:
          JWC_PUSH_CHANNEL: serverchan
          JWC_PUSH_TOKEN: ${{ secrets.JWC_PUSH_TOKEN }}
        run: python fetch_jwc.py --no-vault --out briefing.md

      - name: 强制测试推送（手动触发）
        if: ${{ inputs.test_push }}
        env:
          JWC_PUSH_CHANNEL: serverchan
          JWC_PUSH_TOKEN: ${{ secrets.JWC_PUSH_TOKEN }}
        run: python fetch_jwc.py --days 1 --no-vault --out briefing.md

      - name: 保存状态（同时避免 GitHub 因长期无活动停掉定时任务）
        run: |
          git config user.name "jwc-bot"
          git config user.email "jwc-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state update $(date -u +%Y-%m-%d_%H:%MZ)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: briefing.md
          retention-days: 30
